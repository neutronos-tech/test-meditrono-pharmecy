name: Desktop release

# Builds the Windows desktop app and packages it as a zip customers can
# unzip and run: no installer, terminal or extra software needed.
# Run it from the Actions tab, or push a tag such as desktop-v0.1.0 to also
# attach the zip to a GitHub release.

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 package
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build the desktop app
        run: cargo build --release --locked -p frontend

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^desktop-v', '' } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $name = "MeditrinoPharmacy-$version-windows-x64"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/frontend.exe "$dir/Meditrino Pharmacy.exe"
          Copy-Item crates/frontend/assets/inter/LICENSE.txt "$dir/Inter font license.txt"
          @"
          Meditrino Pharmacy $version

          1. Unzip this folder anywhere, for example your Desktop or Documents.
          2. Double-click "Meditrino Pharmacy.exe".
          3. Sign in with your pharmacy account. The first sign-in needs the
             internet to download the medicine catalogue; after that the app
             works offline.

          Your data is stored on this computer in
          %APPDATA%\Pharmacy\Pharmacy\data
          "@ | Set-Content -Encoding utf8 "$dir/READ ME FIRST.txt"
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          "ZIP_PATH=dist/$name.zip" >> $env:GITHUB_ENV
          "ZIP_NAME=$name" >> $env:GITHUB_ENV

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}

      - name: Attach to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "${{ env.ZIP_PATH }}" --title "Meditrino Pharmacy ${{ github.ref_name }}" --generate-notes
